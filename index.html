<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kisan Manager Pro (Nature Redesign)</title>
    <style>
        :root {
            /* Nature Theme Palette - Modernized */
            --primary: #2E7D32;       /* Forest Green */
            --primary-dark: #1B5E20;  /* Deep Leaf */
            --primary-light: #E8F5E9; /* Pale Mint */
            --accent: #F9A825;        /* Harvest Yellow/Orange */
            --bg: #F1F8E9;            /* Light Field Background */
            --card-bg: #FFFFFF;
            --text: #333333;
            --danger: #C62828;        /* Red Clay */
            --success: #388E3C;       /* Fresh Grass */
            --blue: #1976D2;          /* Water Blue */
            --radius: 15px;
            --shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: var(--bg); 
            margin: 0; padding: 0; 
            color: var(--text); 
            padding-bottom: 90px; /* Space for bottom nav */
        }
        
        /* Modern Nature Header */
        header { 
            background: linear-gradient(135deg, var(--primary), var(--primary-dark)); 
            color: white; 
            padding: 25px 20px; 
            text-align: center; 
            font-size: 22px; 
            font-weight: 800; 
            box-shadow: 0 4px 10px rgba(46, 125, 50, 0.3);
            border-radius: 0 0 25px 25px;
            margin-bottom: 20px;
        }

        .container { padding: 15px; max-width: 600px; margin: auto; }

        /* Modern Cards */
        .card { 
            background: var(--card-bg); 
            padding: 20px; 
            border-radius: var(--radius); 
            box-shadow: var(--shadow); 
            margin-bottom: 20px; 
            border: 1px solid rgba(0,0,0,0.05);
        }

        h3 { 
            margin: 0 0 15px 0; 
            color: var(--primary-dark); 
            font-size: 18px; 
            border-bottom: 2px solid var(--primary-light);
            padding-bottom: 8px;
            display: flex; align-items: center; gap: 8px;
        }

        /* Inputs */
        label { 
            font-size: 13px; 
            font-weight: 600; 
            color: #558b2f; 
            display: block; 
            margin-bottom: 5px; 
            margin-top: 12px;
        }
        
        input, select { 
            width: 100%; padding: 14px; margin-bottom: 5px; 
            border: 1px solid #c5e1a5; 
            border-radius: 10px; 
            box-sizing: border-box;
            background: #FAFAFA;
            font-size: 16px; /* Prevents zoom on iPhone */
            transition: all 0.3s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.1);
        }

        .input-group { display: flex; gap: 10px; margin-bottom: 12px; }
        .input-group select { width: 40%; margin-bottom: 0; }
        .input-group input { width: 60%; margin-bottom: 0; }

        /* Buttons */
        button.action-btn { 
            width: 100%; 
            background: var(--primary);
            color: white; 
            padding: 15px; 
            border: none; 
            border-radius: 12px; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            margin-top: 15px;
            box-shadow: 0 4px 6px rgba(46, 125, 50, 0.2);
            transition: transform 0.1s;
        }
        button.action-btn:active { transform: scale(0.97); }

        .btn-blue { background: var(--blue) !important; }
        .btn-orange { background: var(--accent) !important; }
        .btn-red { background: var(--danger) !important; }
        .btn-green { background: var(--success) !important; }
        
        .btn-small { 
            padding: 6px 12px; font-size: 12px; border-radius: 6px; 
            border: none; color: white; cursor: pointer; margin-left: 4px; 
        }

        /* Lists & Tables */
        .log-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 0; border-bottom: 1px solid #f0f0f0;
        }
        .status-paid { background: #E8F5E9; color: #2E7D32; padding: 4px 8px; border-radius: 20px; font-size: 11px; font-weight: bold; }
        .status-pending { background: #FFEBEE; color: #C62828; padding: 4px 8px; border-radius: 20px; font-size: 11px; font-weight: bold; }
        
        table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 10px; }
        th { color: #777; font-size: 12px; text-align: left; padding-bottom: 5px; }
        td { padding: 8px 0; border-bottom: 1px solid #eee; }

        /* Floating Bottom Tabs */
        .tabs { 
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 500px;
            background: white; 
            display: flex; justify-content: space-around;
            padding: 10px; border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            z-index: 100;
        }
        .tab-btn { 
            background: none; border: none; 
            color: #9E9E9E; font-size: 10px; font-weight: 700; 
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            cursor: pointer; 
        }
        .tab-btn span { font-size: 20px; }
        .tab-btn.active { color: var(--primary); transform: scale(1.1); transition: 0.2s; }

        .hidden { display: none; }
        .sync-box { text-align: center; margin-bottom: 15px; font-size: 14px; color: #555; }
    </style>
</head>
<body>

<header>🌾 Kisan Manager Pro</header>

<div class="container">

    <div id="entry" class="tab-content">
        <div class="card">
            <h3>📝 Add Daily Work</h3>
            <input type="hidden" id="editWorkId">
            <label>Date</label><input type="date" id="workDate">
            <label>Worker</label><select id="selWorker" onchange="updateDefaultRate()"></select>
            
            <label>Work Type</label>
            <div class="input-group">
                <select id="selWorkType" onchange="fillWorkType()">
                    <option value="">-- Select --</option>
                </select>
                <input type="text" id="manualWorkType" placeholder="Or type here...">
            </div>

            <label>Rate (₹)</label><input type="number" id="workRate">
            <div class="input-group" style="margin-top:5px;">
                <div style="flex:1">
                    <label style="margin-top:0">Farm</label>
                    <select id="selFarm"></select>
                </div>
                <div style="flex:1">
                    <label style="margin-top:0">Crop</label>
                    <select id="selCrop"></select>
                </div>
            </div>
            
            <div style="display:flex; gap:10px;">
                <div style="flex:1">
                    <label>Shift</label>
                    <select id="workStatus">
                        <option value="1">Full Day</option>
                        <option value="0.5">Half Day</option>
                    </select>
                </div>
                <div style="flex:1">
                    <label>Payment</label>
                    <select id="payStatus">
                        <option value="Pending" selected>🔴 Pending</option>
                        <option value="Paid">🟢 Paid Now</option>
                    </select>
                </div>
            </div>

            <button class="action-btn" onclick="saveWork()">SAVE WORK</button>
            <button class="action-btn btn-red hidden" id="btnCancelWork" onclick="resetForm()">CANCEL EDIT</button>
        </div>
        <div class="card">
            <h3>📜 Recent Activity</h3>
            <div id="quickWorkLog"></div>
        </div>
    </div>

    <div id="payments" class="tab-content hidden">
        <div class="card" style="border-left: 5px solid var(--danger);">
            <h3>⚠️ Pending Dues</h3>
            <label>Filter by Worker</label>
            <select id="pendingFilterWorker" onchange="renderPendingDues()"></select>
            <div id="pendingDuesList" style="margin-top:15px; max-height:300px; overflow-y:auto;"></div>
        </div>

        <div class="card" style="border-left: 5px solid var(--accent);">
            <h3>💰 Give Advance</h3>
            <input type="hidden" id="editAdvId">
            <label>Date</label><input type="date" id="advDate">
            <label>Worker</label><select id="selWorkerAdv"></select>
            <label>Amount (₹)</label><input type="number" id="advAmount">
            <label>Note</label><input type="text" id="advNote" placeholder="Reason (Optional)">
            <button class="action-btn btn-orange" onclick="saveAdvance()">SAVE ADVANCE</button>
            <button class="action-btn btn-red hidden" id="btnCancelAdv" onclick="resetForm()">CANCEL EDIT</button>
        </div>

        <div class="card">
            <h3>📅 Advance History</h3>
            <div id="advHistoryLog"></div>
        </div>
    </div>

    <div id="report" class="tab-content hidden">
        <div class="card">
            <h3>📊 Financial Report</h3>
            <div class="input-group">
                <input type="date" id="rptStart" onchange="renderReports()">
                <input type="date" id="rptEnd" onchange="renderReports()">
            </div>
            <label>Filter by Crop</label>
            <select id="rptCrop" onchange="renderReports()"></select>
            
            <div id="reportSummary" style="margin-top:20px;"></div>
            <button class="action-btn btn-blue" onclick="exportCSV()">📥 Download Excel</button>
        </div>
    </div>

    <div id="setup" class="tab-content hidden">
        <div class="card">
            <h3>☁️ Cloud Backup</h3>
            <p style="font-size:12px; color:#666; margin-bottom:10px;">Connect to Google Drive Script</p>
            <input type="text" id="cloudUrl" placeholder="Paste Google Script Web App URL">
            <button class="action-btn btn-small" style="margin-top:5px; width:auto;" onclick="saveCloudUrl()">Save URL</button>
            
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:20px;">
                <button class="action-btn btn-blue" style="margin-top:0;" onclick="uploadData()">
                    ⬆️ Upload
                </button>
                <button class="action-btn btn-blue" style="margin-top:0;" onclick="downloadData()">
                    ⬇️ Download
                </button>
            </div>
            <p id="syncStatus" class="sync-box" style="margin-top:15px;">Status: Ready</p>
        </div>

        <div class="card">
            <h3>⚙️ Master Data</h3>
            <div class="input-group">
                <input type="text" id="masterInput" placeholder="Add Item Name..." style="margin-bottom:0;">
                <button class="btn-small btn-green" style="width:50px; border-radius:8px;" onclick="addItem('workers')">+</button>
            </div>
            <div style="display:flex; flex-wrap:wrap; gap:5px; margin-bottom:15px;">
                <button class="btn-small btn-blue" onclick="addItem('workers')">+ Worker</button>
                <button class="btn-small btn-blue" onclick="addItem('farms')">+ Farm</button>
                <button class="btn-small btn-blue" onclick="addItem('crops')">+ Crop</button>
                <button class="btn-small btn-blue" onclick="addItem('workTypes')">+ Work Type</button>
            </div>
            <div id="masterListDisplay"></div>
        </div>
    </div>

</div>

<div class="tabs">
    <button id="btn-entry" class="tab-btn active" onclick="showTab('entry')">
        <span>📝</span>Work
    </button>
    <button id="btn-payments" class="tab-btn" onclick="showTab('payments')">
        <span>₹</span>Pay
    </button>
    <button id="btn-report" class="tab-btn" onclick="showTab('report')">
        <span>📊</span>Report
    </button>
    <button id="btn-setup" class="tab-btn" onclick="showTab('setup')">
        <span>⚙️</span>Setup
    </button>
</div>

<script>
    // --- DATABASE INIT ---
    let db = { workers: [], farms: [], crops: [], workTypes: ['Weeding', 'Harvesting', 'Sowing', 'Spray'], entries: [], advances: [] };

    try {
        const saved = localStorage.getItem('kisanDB');
        if(saved) {
            const parsed = JSON.parse(saved);
            db = { ...db, ...parsed };
            if(!db.workTypes) db.workTypes = ['Weeding', 'Harvesting', 'Sowing', 'Spray'];
        }
    } catch(e) { console.log("DB Init Error"); }

    function saveDB() {
        localStorage.setItem('kisanDB', JSON.stringify(db));
    }

    // --- TABS ---
    function showTab(id) {
        document.querySelectorAll('.tab-content').forEach(d => d.classList.add('hidden'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.remove('hidden');
        document.getElementById('btn-' + id).classList.add('active');
        
        refreshUI();
        if(id === 'report') renderReports();
        if(id === 'payments') renderPendingDues();
    }

    // --- SETTINGS ---
    function addItem(type) {
        const val = document.getElementById('masterInput').value.trim();
        if(!val) return alert("Enter a name!");
        if(type === 'workers') db.workers.push({name: val, rate: 0});
        else db[type].push(val);
        document.getElementById('masterInput').value = "";
        saveDB(); refreshUI(); alert("Added!");
    }

    function deleteMaster(type, index) {
        if(confirm("Delete this item?")) {
            db[type].splice(index, 1);
            saveDB(); refreshUI();
        }
    }

    // --- WORK ENTRY LOGIC ---
    function fillWorkType() {
        const select = document.getElementById('selWorkType');
        const input = document.getElementById('manualWorkType');
        if(select.value) input.value = select.value;
    }

    function saveWork() {
        const id = document.getElementById('editWorkId').value;
        const workType = document.getElementById('manualWorkType').value;
        const isPaid = document.getElementById('payStatus').value === 'Paid';

        const entry = {
            id: id ? parseInt(id) : Date.now(),
            date: document.getElementById('workDate').value,
            worker: document.getElementById('selWorker').value,
            rate: parseFloat(document.getElementById('workRate').value) || 0,
            farm: document.getElementById('selFarm').value,
            crop: document.getElementById('selCrop').value,
            type: workType || "General",
            status: parseFloat(document.getElementById('workStatus').value),
            isPaid: isPaid
        };

        if(!entry.date || !entry.worker) return alert("Missing Date or Worker");

        if(id) {
            const idx = db.entries.findIndex(e => e.id == id);
            if(idx > -1) db.entries[idx] = entry;
        } else {
            db.entries.push(entry);
        }
        
        saveDB(); resetForm(); refreshUI(); 
        alert("✅ Work Saved Successfully!");
    }

    function editWork(id) {
        const e = db.entries.find(x => x.id == id);
        if(!e) return;
        showTab('entry');
        document.getElementById('editWorkId').value = e.id;
        document.getElementById('workDate').value = e.date;
        document.getElementById('selWorker').value = e.worker;
        document.getElementById('workRate').value = e.rate;
        document.getElementById('selFarm').value = e.farm;
        document.getElementById('selCrop').value = e.crop;
        document.getElementById('manualWorkType').value = e.type || "";
        document.getElementById('payStatus').value = e.isPaid ? "Paid" : "Pending";
        document.getElementById('btnCancelWork').classList.remove('hidden');
    }

    function deleteWork(id) {
        if(confirm("Delete this entry?")) {
            db.entries = db.entries.filter(e => e.id !== id);
            saveDB(); refreshUI();
        }
    }

    // --- PAYMENTS & DUES LOGIC ---
    function renderPendingDues() {
        const filterW = document.getElementById('pendingFilterWorker').value;
        const listDiv = document.getElementById('pendingDuesList');
        
        let html = ``;
        
        let pendingCount = 0;
        db.entries.slice().reverse().forEach(e => {
            if(!e.isPaid) {
                if(filterW && e.worker !== filterW) return;
                const amt = e.rate * e.status;
                html += `<div class="log-item">
                    <div>
                        <div style="font-weight:bold;">${e.worker}</div>
                        <div style="font-size:12px; color:#666;">${e.date} • ${e.type}</div>
                    </div>
                    <div style="text-align:right;">
                        <div style="color:var(--danger); font-weight:bold;">₹${amt}</div>
                        <button class="btn-small btn-blue" style="margin-top:5px;" onclick="markAsPaid(${e.id})">Mark Paid</button>
                    </div>
                </div>`;
                pendingCount++;
            }
        });

        if(pendingCount === 0) html = "<div style='padding:20px; text-align:center; color:#888;'>✅ No pending dues.</div>";
        listDiv.innerHTML = html;
    }

    function markAsPaid(id) {
        if(confirm("Mark this work as PAID?")) {
            const idx = db.entries.findIndex(e => e.id == id);
            if(idx > -1) {
                db.entries[idx].isPaid = true;
                saveDB();
                renderPendingDues();
                refreshUI();
            }
        }
    }

    function saveAdvance() {
        const id = document.getElementById('editAdvId').value;
        const adv = {
            id: id ? parseInt(id) : Date.now(),
            date: document.getElementById('advDate').value,
            worker: document.getElementById('selWorkerAdv').value,
            amount: parseFloat(document.getElementById('advAmount').value) || 0,
            note: document.getElementById('advNote').value
        };

        if(!adv.date || !adv.worker || !adv.amount) return alert("Missing Data");

        if(id) {
            const idx = db.advances.findIndex(a => a.id == id);
            if(idx > -1) db.advances[idx] = adv;
        } else {
            db.advances.push(adv);
        }

        saveDB(); resetForm(); refreshUI(); 
        alert("✅ Advance Saved!");
    }

    function editAdv(id) {
        const a = db.advances.find(x => x.id == id);
        if(!a) return;
        showTab('payments');
        document.getElementById('editAdvId').value = a.id;
        document.getElementById('advDate').value = a.date;
        document.getElementById('selWorkerAdv').value = a.worker;
        document.getElementById('advAmount').value = a.amount;
        document.getElementById('advNote').value = a.note;
        document.getElementById('btnCancelAdv').classList.remove('hidden');
    }

    function deleteAdv(id) {
        if(confirm("Delete this advance?")) {
            db.advances = db.advances.filter(a => a.id !== id);
            saveDB(); refreshUI();
        }
    }

    // --- REPORTS ---
    function renderReports() {
        const start = document.getElementById('rptStart').value;
        const end = document.getElementById('rptEnd').value;
        const cropFilter = document.getElementById('rptCrop').value;

        let html = `<table><tr><th>Worker</th><th>Pend</th><th>Adv</th><th>Net</th></tr>`;
        
        db.workers.forEach(w => {
            const pendingWorkAmt = db.entries
                .filter(e => e.worker === w.name && !e.isPaid)
                .filter(e => (!start || e.date >= start) && (!end || e.date <= end))
                .filter(e => (cropFilter === 'All' || e.crop === cropFilter))
                .reduce((sum, e) => sum + (e.rate * e.status), 0);

            const advancesAmt = db.advances
                .filter(a => a.worker === w.name)
                .filter(a => (!start || a.date >= start) && (!end || a.date <= end))
                .reduce((sum, a) => sum + a.amount, 0);

            const balance = pendingWorkAmt - advancesAmt;

            html += `<tr>
                <td style="font-weight:bold;">${w.name}</td>
                <td>${pendingWorkAmt}</td>
                <td>${advancesAmt}</td>
                <td style="color:${balance < 0 ? 'var(--danger)' : 'var(--primary)'}; font-weight:bold;">₹${balance}</td>
            </tr>`;
        });
        document.getElementById('reportSummary').innerHTML = html + `</table>`;
    }

    function exportCSV() {
        let csv = "Date,Worker,Type,Amount,Status,Note\n";
        db.entries.forEach(e => csv += `${e.date},${e.worker},${e.type || 'Work'},${e.rate*e.status},${e.isPaid ? 'Paid' : 'Pending'},-\n`);
        db.advances.forEach(a => csv += `${a.date},${a.worker},Advance,${a.amount},-,${a.note}\n`);
        
        const blob = new Blob([csv], { type: 'text/csv' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = "Kisan_Report.csv";
        link.click();
    }

    // --- CLOUD SYNC FUNCTIONS (UPDATED) ---
    function saveCloudUrl() {
        localStorage.setItem('kisanCloudUrl', document.getElementById('cloudUrl').value);
        alert("URL Saved!");
    }

    async function uploadData() {
        const url = localStorage.getItem('kisanCloudUrl');
        if(!url) return alert("No Cloud URL Saved");
        
        document.getElementById('syncStatus').innerText = "📤 Uploading...";
        try {
            await fetch(url, { method: 'POST', body: JSON.stringify(db) });
            document.getElementById('syncStatus').innerText = "✅ Upload Success";
            alert("Data Uploaded to Cloud!");
        } catch(e) {
            console.error(e);
            document.getElementById('syncStatus').innerText = "❌ Upload Failed";
            alert("Upload Failed. Check Internet.");
        }
    }

    async function downloadData() {
        const url = localStorage.getItem('kisanCloudUrl');
        if(!url) return alert("No Cloud URL Saved");
        
        document.getElementById('syncStatus').innerText = "📥 Downloading...";
        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error("Server Error");
            const cloudData = await response.json();
            
            if(cloudData) {
                if(confirm("Replace current data with Cloud data?")) {
                    db = cloudData;
                    saveDB();
                    refreshUI();
                    renderPendingDues();
                    document.getElementById('syncStatus').innerText = "✅ Download Success";
                    alert("Data Downloaded & Updated!");
                }
            }
        } catch(e) {
            console.error(e);
            document.getElementById('syncStatus').innerText = "❌ Download Failed";
            alert("Download Failed. Ensure Script Permissions are set to 'Anyone'.");
        }
    }

    // --- UI HELPERS ---
    function refreshUI() {
        const fill = (id, list, isObj) => {
            const el = document.getElementById(id);
            if(!el) return;
            const old = el.value;
            el.innerHTML = '<option value="">-- Select --</option>';
            list.forEach(i => {
                const val = isObj ? i.name : i;
                el.innerHTML += `<option value="${val}">${val}</option>`;
            });
            if(old) el.value = old;
        };

        fill('selWorker', db.workers, true);
        fill('selWorkerAdv', db.workers, true);
        fill('pendingFilterWorker', db.workers, true);
        fill('selFarm', db.farms, false);
        fill('selCrop', db.crops, false);
        fill('selWorkType', db.workTypes, false); 
        
        const rptCrop = document.getElementById('rptCrop');
        rptCrop.innerHTML = '<option value="All">All Crops</option>';
        db.crops.forEach(c => rptCrop.innerHTML += `<option value="${c}">${c}</option>`);

        window.updateDefaultRate = () => {
            const w = db.workers.find(x => x.name === document.getElementById('selWorker').value);
            if(w) document.getElementById('workRate').value = w.rate;
        };

        // Render Logs with Modern Look
        let wHtml = ``;
        db.entries.slice().reverse().slice(0,10).forEach(e => {
            const sts = e.isPaid ? '<span class="status-paid">Paid</span>' : '<span class="status-pending">Pend</span>';
            wHtml += `<div class="log-item">
                <div>
                    <div style="font-weight:600;">${e.worker}</div>
                    <div style="font-size:12px; color:#666;">${e.date} • ${e.type}</div>
                </div>
                <div style="text-align:right;">
                    ${sts}
                    <div style="margin-top:5px;">
                        <button class="btn-small btn-blue" onclick="editWork(${e.id})">✏️</button>
                        <button class="btn-small btn-red" onclick="deleteWork(${e.id})">✕</button>
                    </div>
                </div>
            </div>`;
        });
        document.getElementById('quickWorkLog').innerHTML = wHtml;

        let aHtml = ``;
        db.advances.slice().reverse().forEach(a => {
            aHtml += `<div class="log-item">
                <div>
                    <div style="font-weight:600;">${a.worker}</div>
                    <div style="font-size:12px; color:#666;">${a.date}</div>
                </div>
                <div style="text-align:right;">
                    <div style="font-weight:bold; color:var(--blue);">₹${a.amount}</div>
                    <div style="margin-top:5px;">
                        <button class="btn-small btn-blue" onclick="editAdv(${a.id})">✏️</button>
                        <button class="btn-small btn-red" onclick="deleteAdv(${a.id})">✕</button>
                    </div>
                </div>
            </div>`;
        });
        document.getElementById('advHistoryLog').innerHTML = aHtml;

        let mHtml = "";
        ['workers', 'farms', 'crops', 'workTypes'].forEach(k => {
            mHtml += `<div style="background:var(--primary-light); color:var(--primary-dark); padding:6px 10px; font-weight:bold; margin-top:15px; border-radius:6px; font-size:12px;">${k.toUpperCase()}</div>`;
            db[k].forEach((item, i) => {
                const name = typeof item === 'object' ? item.name : item;
                mHtml += `<div class="log-item" style="padding:8px 0;">
                    <span>${name}</span> 
                    <button class="btn-small btn-red" onclick="deleteMaster('${k}',${i})">✕</button>
                </div>`;
            });
        });
        document.getElementById('masterListDisplay').innerHTML = mHtml;
    }

    function resetForm() {
        document.getElementById('editWorkId').value = "";
        document.getElementById('editAdvId').value = "";
        document.getElementById('btnCancelWork').classList.add('hidden');
        document.getElementById('btnCancelAdv').classList.add('hidden');
        document.getElementById('payStatus').value = "Pending";
        document.querySelectorAll('input').forEach(i => {
            if(i.type !== 'date' && i.id !== 'cloudUrl') i.value = "";
        });
    }

    window.onload = () => {
        document.querySelectorAll('input[type="date"]').forEach(d => d.valueAsDate = new Date());
        const savedUrl = localStorage.getItem('kisanCloudUrl');
        if(savedUrl) document.getElementById('cloudUrl').value = savedUrl;
        refreshUI();
        renderPendingDues();
    };

</script>
</body>
</html>
